# Used only by the fixed CSN initial-backup helper; not a daemon configuration.
protocols =
ssl = no
log_path = /dev/stderr
info_log_path = /dev/stderr
mail_home = /home/csn
mail_location = maildir:/home/csn/Maildir
mail_uid = 1001
mail_gid = 1001
mail_plugins =
first_valid_uid = 1
namespace inbox {
  inbox = yes
  separator = /
  prefix =
}
